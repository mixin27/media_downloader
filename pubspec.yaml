name: media_downloader
description: "A comprehensive Flutter package for downloading media files with background support, notifications, and progress tracking."
version: 1.0.0
homepage: https://github.com/mixin27/media_downloader

environment:
  sdk: ^3.10.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client
  dio: ^5.9.0

  # Storage
  path_provider: ^2.1.5
  path: ^1.9.1

  # Database
  sqflite: ^2.4.2

  # Background tasks
  workmanager: ^0.8.0
  # Foreground tasks
  flutter_foreground_task: ^9.1.0

  # Notifications
  flutter_local_notifications: ^19.5.0

  # Permissions
  permission_handler: ^12.0.1

  # Utilities
  uuid: ^4.5.2
  connectivity_plus: ^7.0.0
  device_info_plus: ^12.2.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
